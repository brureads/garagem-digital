<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garagem Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚗 Garagem Digital</h1>
        <p>Descubra modelos de diferentes fabricantes.</p>
    </header>

    <main>

        <section class="busca">
            <label for="campo-busca">Digite uma marca de carro:</label>

            <div class="area-busca">
                <input type="text" id="campo-busca" placeholder="Ex.: BYD, Toyota, Ford...">

                <button id="botao-buscar">
                    Buscar
                </button>
            </div>
        </section>

        <section id="resultado">
            <p>Digite uma marca para começar a pesquisa.</p>
        </section>

    </main>

    <footer>
        <p>Garagem Digital • Bootcamp II</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
